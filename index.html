<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きらっと 記念発行版 | MiraQue サンデーコレクション</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
  integrity="sha384-Ftcjj/GNLxPvzNDftO/oryXB9aGxsGZY9JGqsXG0uUKgQDl9RfDgsx9NJ/4IVNPe"
  crossorigin="anonymous"></script>
<style>
  :root {
    --ink: #1d2333;
    --accent: #f5a623;
    --bg: #0e1424;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, #0e1424 0%, #1c2a4a 60%, #2b3f66 100%);
    color: #f2f5fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 48px;
  }
  .brand { font-size: 12px; letter-spacing: .2em; color: #9fb0d0; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 14px; text-align: center; }
  .serial-card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 10px 22px;
    text-align: center;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
  }
  .serial-label { font-size: 11px; color: #b8c6e2; letter-spacing: .12em; }
  .serial-no { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .serial-edition { font-size: 12px; color: #d6deef; }
  model-viewer {
    width: min(92vw, 480px);
    height: min(60vh, 480px);
    background: radial-gradient(circle at 50% 35%, #3a5385 0%, #22314f 70%);
    border-radius: 18px;
    --poster-color: transparent;
  }
  .hint { font-size: 12px; color: #aebbd8; margin: 10px 0 18px; text-align: center; line-height: 1.7; }
  .buttons { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 420px); }
  .btn {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(180deg, #ffd479, var(--accent));
    box-shadow: 0 4px 14px rgba(245,166,35,.35);
  }
  .btn.sub { background: rgba(255,255,255,.12); color: #f2f5fb; box-shadow: none; border: 1px solid rgba(255,255,255,.25); }
  .note { margin-top: 22px; font-size: 11px; color: #8c9bbd; text-align: center; line-height: 1.8; max-width: 420px; }
  .error { margin-top: 40px; font-size: 14px; color: #ffb3b3; text-align: center; line-height: 2; }
</style>
</head>
<body>
  <div class="brand">MiraQue SUNDAY COLLECTION</div>
  <h1 id="page-title">きらっと 記念発行版</h1>
  <div id="app"></div>
  <script>
  (async function () {
    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    const raw = parseInt(params.get("n"), 10);
    const sKey = params.get("s") || "kiratto";

    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let manifest = { prefix: "KIRATTO", count: 100, title: "きらっと 記念発行版" };
    try {
      const res = await fetch("manifest.json", { cache: "no-store" });
      if (res.ok) manifest = Object.assign(manifest, await res.json());
    } catch (e) { /* file:// 等では既定値で続行 */ }

    // シリーズ解決: series マップ優先、kiratto は旧トップレベルにフォールバック
    // URLの ?s= がそのままキーになるので、自前の項目だけを見る
    // （hasOwnProperty を通さないと ?s=__proto__ で Object.prototype を拾ってしまう）
    const table = (manifest.series && typeof manifest.series === "object") ? manifest.series : {};
    let series = Object.prototype.hasOwnProperty.call(table, sKey) ? table[sKey] : null;
    if (!series && sKey === "kiratto") {
      series = { prefix: manifest.prefix, count: manifest.count,
                 title: manifest.title, issued_at: manifest.issued_at };
    }
    if (!series) {
      app.innerHTML = '<div class="error">このシリーズは見つかりません。<br>配布スタッフのQRコードを読み取ってください。</div>';
      return;
    }
    series.count = parseInt(series.count, 10) || 100;
    document.getElementById("page-title").textContent = series.title || "記念発行版";
    document.title = (series.title || "記念発行版") + " | MiraQue サンデーコレクション";

    // 番号なしで開かれた場合、シリーズが base を持っていればそれを出す
    // （番号を使い切った・スタッフ端末が使えない等の予備経路。番号は付かない）
    // ファイル名になる値は prefix も base も同じ字種に限る（files/ の外を指させない）
    const fileName = v => /^[A-Za-z0-9_-]+$/.test(v || "") ? v : null;
    const hasNum = Number.isInteger(raw);
    const baseName = fileName(series.base);
    const prefixName = fileName(series.prefix);
    const baseMode = !hasNum && !!baseName;

    if (!baseMode && (!hasNum || raw < 1 || raw > series.count || !prefixName)) {
      app.innerHTML = '<div class="error">この番号は見つかりません。<br>配布スタッフのQRコードを読み取ってください。</div>';
      return;
    }

    const num = hasNum ? String(raw).padStart(4, "0") : "";
    const stem = baseMode ? baseName : prefixName + "-" + num;
    const glb = "files/" + stem + ".glb";
    const usdz = "files/" + stem + ".usdz";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const serialCard = baseMode ? "" : `
      <div class="serial-card">
        <div class="serial-label">COMMEMORATIVE No.</div>
        <div class="serial-no">${num}</div>
        <div class="serial-edition">${raw} / ${series.count}</div>
      </div>`;
    const issuer = `発行: ${esc(manifest.issuer || "MiraQue")}${series.issued_at ? " / " + esc(series.issued_at) : ""}`;

    app.innerHTML = `
      ${serialCard}
      <model-viewer src="${glb}" ios-src="${usdz}"
        ar ar-modes="scene-viewer webxr quick-look"
        camera-controls autoplay auto-rotate
        alt="${esc(series.title || "")}">
      </model-viewer>
      <div class="hint">指でぐるぐる回せます。<br>「ARで見る」で目の前の空間に置けます。</div>
      <div class="buttons">
        <a class="btn" id="ar-btn" href="#">AR で目の前に置く</a>
        <a class="btn sub" href="${isIOS ? usdz : glb}" download="${stem}${isIOS ? ".usdz" : ".glb"}">
          データを持ち帰る（${isIOS ? "USDZ" : "GLB"}）
        </a>
      </div>
      <div class="note">
        ${baseMode ? "" : "記念の通し番号です。<br>"}${issuer}
      </div>`;

    document.getElementById("ar-btn").addEventListener("click", function (e) {
      e.preventDefault();
      const mv = app.querySelector("model-viewer");
      if (mv && mv.activateAR) mv.activateAR();
    });
  })();
  </script>
</body>
</html>
