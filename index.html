<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きらっと 記念発行版 | MiraQue サンデーコレクション</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
  integrity="sha384-Ftcjj/GNLxPvzNDftO/oryXB9aGxsGZY9JGqsXG0uUKgQDl9RfDgsx9NJ/4IVNPe"
  crossorigin="anonymous"></script>
<style>
  :root {
    --ink: #1d2333;
    --accent: #f5a623;
    --bg: #0e1424;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, #0e1424 0%, #1c2a4a 60%, #2b3f66 100%);
    color: #f2f5fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 48px;
  }
  .brand { font-size: 12px; letter-spacing: .2em; color: #9fb0d0; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 14px; text-align: center; }
  .serial-card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 10px 22px;
    text-align: center;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
  }
  .serial-label { font-size: 11px; color: #b8c6e2; letter-spacing: .12em; }
  .serial-no { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .serial-edition { font-size: 12px; color: #d6deef; }
  model-viewer {
    width: min(92vw, 480px);
    height: min(60vh, 480px);
    background: radial-gradient(circle at 50% 35%, #3a5385 0%, #22314f 70%);
    border-radius: 18px;
    --poster-color: transparent;
  }
  .hint { font-size: 12px; color: #aebbd8; margin: 10px 0 18px; text-align: center; line-height: 1.7; }
  .buttons { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 420px); }
  .btn {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(180deg, #ffd479, var(--accent));
    box-shadow: 0 4px 14px rgba(245,166,35,.35);
  }
  .btn.sub { background: rgba(255,255,255,.12); color: #f2f5fb; box-shadow: none; border: 1px solid rgba(255,255,255,.25); }
  .note { margin-top: 22px; font-size: 11px; color: #8c9bbd; text-align: center; line-height: 1.8; max-width: 420px; }
  .error { margin-top: 40px; font-size: 14px; color: #ffb3b3; text-align: center; line-height: 2; }
</style>
</head>
<body>
  <div class="brand">MiraQue SUNDAY COLLECTION</div>
  <h1>きらっと 記念発行版</h1>
  <div id="app"></div>
  <script>
  (async function () {
    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    const raw = parseInt(params.get("n"), 10);

    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let manifest = { prefix: "KIRATTO", count: 100, title: "きらっと 記念発行版" };
    try {
      const res = await fetch("manifest.json", { cache: "no-store" });
      if (res.ok) manifest = Object.assign(manifest, await res.json());
    } catch (e) { /* file:// 等では既定値で続行 */ }
    manifest.count = parseInt(manifest.count, 10) || 100;

    if (!Number.isInteger(raw) || raw < 1 || raw > manifest.count) {
      app.innerHTML = '<div class="error">この番号は見つかりません。<br>配布スタッフのQRコードを読み取ってください。</div>';
      return;
    }

    const num = String(raw).padStart(4, "0");
    const serial = manifest.prefix + "-" + num;
    const glb = "files/" + serial + ".glb";
    const usdz = "files/" + serial + ".usdz";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    app.innerHTML = `
      <div class="serial-card">
        <div class="serial-label">COMMEMORATIVE No.</div>
        <div class="serial-no">${num}</div>
        <div class="serial-edition">${raw} / ${manifest.count}</div>
      </div>
      <model-viewer src="${glb}" ios-src="${usdz}"
        ar ar-modes="scene-viewer webxr quick-look"
        camera-controls autoplay auto-rotate
        alt="${serial}">
      </model-viewer>
      <div class="hint">指でぐるぐる回せます。<br>「ARで見る」で目の前の空間に置けます。</div>
      <div class="buttons">
        <a class="btn" id="ar-btn" href="#">AR で目の前に置く</a>
        <a class="btn sub" href="${isIOS ? usdz : glb}" download="${serial}${isIOS ? ".usdz" : ".glb"}">
          データを持ち帰る（${isIOS ? "USDZ" : "GLB"}）
        </a>
      </div>
      <div class="note">
        この3Dデータは記念発行版です。番号 ${num} は配布運用上、この1枚だけお渡ししています。<br>
        発行: ${esc(manifest.issuer || "MiraQue")}${manifest.issued_at ? " / " + esc(manifest.issued_at) : ""}
      </div>`;

    document.getElementById("ar-btn").addEventListener("click", function (e) {
      e.preventDefault();
      const mv = app.querySelector("model-viewer");
      if (mv && mv.activateAR) mv.activateAR();
    });
  })();
  </script>
</body>
</html>
